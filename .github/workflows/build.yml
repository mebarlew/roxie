name: Build APK

# Manual only: Actions minutes on a private repo are limited.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ROXIE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/roxie.p12"
      - name: Build release APK
        env:
          ROXIE_GATEWAY_KEY: ${{ secrets.ROXIE_GATEWAY_KEY }}
          ROXIE_KEYSTORE: ${{ runner.temp }}/roxie.p12
          ROXIE_KEYSTORE_PASSWORD: ${{ secrets.ROXIE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: roxie-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
