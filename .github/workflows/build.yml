name: Build APK

# Manual only: Actions minutes on a private repo are limited.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ROXIE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/roxie.p12"
      - name: Build release APK
        env:
          ROXIE_GATEWAY_KEY: ${{ secrets.ROXIE_GATEWAY_KEY }}
          ROXIE_KEYSTORE: ${{ runner.temp }}/roxie.p12
          ROXIE_KEYSTORE_PASSWORD: ${{ secrets.ROXIE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      # The repo is public and the APK carries the app's gateway key, so only an encrypted copy is uploaded.
      - name: Encrypt APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ROXIE_ARTIFACT_PASSWORD }}
        run: |
          test -n "$ARTIFACT_PASSWORD"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_PASSWORD \
            -in app/build/outputs/apk/release/app-release.apk -out roxie-apk.enc
      - uses: actions/upload-artifact@v7
        with:
          name: roxie-apk
          path: roxie-apk.enc
          retention-days: 7
